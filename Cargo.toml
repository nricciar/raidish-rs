[workspace]
members = [".", "crates/*", "web"]
default-members = [".", "crates/*"]
resolver = "3"

# Versions shared by the workspace's crates (each crate picks its features).
[workspace.dependencies]
raidish-types = { path = "crates/raidish-types" }
raidish-core = { path = "crates/raidish-core" }
raidish-auth = { path = "crates/raidish-auth" }
raidish-vm = { path = "crates/raidish-vm" }
raidish-cluster = { path = "crates/raidish-cluster" }
raidish-committer = { path = "crates/raidish-committer" }
raidish-etcd = { path = "crates/raidish-etcd" }
raidish-csi = { path = "crates/raidish-csi" }
raidish-nfs = { path = "crates/raidish-nfs" }
raidish-block = { path = "crates/raidish-block" }
raidish-services = { path = "crates/raidish-services" }
raidish-agent = { path = "crates/raidish-agent" }
raidish-ca = { path = "crates/raidish-ca" }
raidish-http = { path = "crates/raidish-http" }
reed-solomon-simd = "3.1.0"
tokio = "1"
futures-util = "0.3"
futures = "0.3"
serde = { version = "1.0.216", features = ["derive"] }
url = "2.5.8"
bincode = "1"
blake3 = "1.8.3"
chrono = "0.4.43"
async-trait = "0.1"
dashmap = "6.1.0"
crossbeam-queue = "0.3.12"
web-time = "1.1"
tokio-stream = "0.1.17"
serde_json = "1.0.133"
tokio-tungstenite = "0.28.0"
tungstenite = "0.28"
serde_yaml = "0.9"
# HTTP serving (HTTP-1). axum 0.8.8: 0.8.9 moves to tungstenite 0.29.
axum = { version = "0.8.8", default-features = false }
tower = { version = "0.5", default-features = false }
tokio-util = "0.7"
serde_urlencoded = "0.7"
openraft = "=0.9.26"
reqwest = { version = "0.12", default-features = false }
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rcgen = { version = "0.13", default-features = false }
x509-parser = "0.16"
ring = "0.17"
# Passphrase and recovery-key KDF for the cluster CA's key slots.
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
time = "0.3"
clap = "4.5"
term_size = "0.3.2"
quick-xml = "0.37"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
libc = "0.2"
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
percent-encoding = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.3"
web-sys = "0.3"
tonic-build = "0.12"
protoc-bin-vendored = "3"
tempfile = "3.24.0"

[package]
name = "raidish"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "raidish"
path = "src/main.rs"

[dependencies]
raidish-http = { workspace = true }
raidish-types = { workspace = true }
raidish-core = { workspace = true }
raidish-auth = { workspace = true }
raidish-vm = { workspace = true }
raidish-cluster = { workspace = true }
raidish-committer = { workspace = true }
raidish-csi = { workspace = true }
raidish-block = { workspace = true }
raidish-services = { workspace = true }
raidish-agent = { workspace = true }
raidish-ca = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "fs", "io-util", "process", "signal"] }
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-manual-roots", "stream"] }
rustls = { workspace = true, features = ["std", "tls12", "ring", "logging"] }
clap = { workspace = true, features = ["derive", "color", "env"] }
libc = { workspace = true }
zeroize = { workspace = true }

