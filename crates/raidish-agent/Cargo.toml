[package]
name = "raidish-agent"
version = "0.1.0"
edition = "2024"
description = "The RAIDish node agent: places and runs volumes, services and VMs on each node; volume handoff and live migration."

[dependencies]
raidish-types = { workspace = true }
raidish-core = { workspace = true }
raidish-auth = { workspace = true }
raidish-vm = { workspace = true }
raidish-cluster = { workspace = true }
raidish-committer = { workspace = true }
raidish-block = { workspace = true }
raidish-services = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "process", "fs"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-manual-roots"] }
rustls = { workspace = true, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
raidish-types = { workspace = true, features = ["testutil"] }
raidish-core = { workspace = true, features = ["testutil"] }
raidish-auth = { workspace = true, features = ["testutil"] }
raidish-cluster = { workspace = true, features = ["testutil"] }
raidish-committer = { workspace = true, features = ["testutil"] }
raidish-vm = { workspace = true, features = ["testutil"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
