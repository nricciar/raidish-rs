# A 3-node raidish cluster (raidz1, one 1 GiB disk per node) with the
# dashboard. See "Try it with Docker" in the README.
#
#   docker compose up --build
#   open https://node0:8881/   (after: echo "127.0.0.1 node0 node1 node2" | sudo tee -a /etc/hosts,
#                               and importing docker/pki/ca.pem as a trusted CA in the browser)
#
# Everything is TLS with client certificates from the cluster's own CA: on
# its first start node0 runs `raidish ca init` (its certificate, an admin
# bundle in ./docker/pki/admin, a join token per peer in ./docker/pki/tokens,
# the recovery keys in ./docker/pki/ca-init.txt), and node1 and node2 run
# `raidish join` with their tokens before they first listen (see
# docker/entrypoint.sh). Sign in to the dashboard with the token `init`
# prints (docker compose logs init). Ports are published on 127.0.0.1 only.
#
# Start over with `docker compose down -v && git clean -fdX docker/pki`: the CA
# lives in the nodes' Raft data (the volumes), the certificates here.
# After a full `down`/`up` the nodes are sealed (they serve, but can't
# sign): `docker compose run --rm --entrypoint raidish init ca unseal`
# with the recovery key from ca-init.txt.

x-node: &node
  image: raidish
  init: true
  environment:
    DISK_SIZE: ${DISK_SIZE:-1G}
    # `listen` serves on 127.0.0.1 unless told otherwise.
    RAIDISH_ADDRESS: 0.0.0.0

services:
  node0:
    <<: *node
    build: .
    hostname: node0
    environment:
      DISK_SIZE: ${DISK_SIZE:-1G}
      RAIDISH_ADDRESS: 0.0.0.0
      RAIDISH_CA_INIT: "1"
      RAIDISH_PORT: "8881"
    command: --config /etc/raidish/node.yaml listen --port 8881
    ports: ["127.0.0.1:8881:8881", "127.0.0.1:9000:9000", "127.0.0.1:9324:9324", "127.0.0.1:2379:2379"]
    volumes:
      - ./docker/node0.yaml:/etc/raidish/node.yaml:ro
      - ./docker/pki:/pki
      - ./docker/pki/node0:/etc/raidish/tls
      - node0:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/etc/raidish/tls/ca.pem", "--cert", "/etc/raidish/tls/cert.pem", "--key", "/etc/raidish/tls/key.pem", "https://localhost:8881/api/v1/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  node1:
    <<: *node
    hostname: node1
    depends_on:
      node0: { condition: service_started }
    environment:
      DISK_SIZE: ${DISK_SIZE:-1G}
      RAIDISH_ADDRESS: 0.0.0.0
      RAIDISH_JOIN: https://node0:8881
      RAIDISH_NODE_ID: "1"
      RAIDISH_PORT: "8882"
    command: --config /etc/raidish/node.yaml listen --port 8882
    ports: ["127.0.0.1:8882:8882"]
    volumes:
      - ./docker/node1.yaml:/etc/raidish/node.yaml:ro
      - ./docker/pki/tokens:/pki/tokens:ro
      - ./docker/pki/node1:/etc/raidish/tls
      - node1:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/etc/raidish/tls/ca.pem", "--cert", "/etc/raidish/tls/cert.pem", "--key", "/etc/raidish/tls/key.pem", "https://localhost:8882/api/v1/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  node2:
    <<: *node
    hostname: node2
    depends_on:
      node0: { condition: service_started }
    environment:
      DISK_SIZE: ${DISK_SIZE:-1G}
      RAIDISH_ADDRESS: 0.0.0.0
      RAIDISH_JOIN: https://node0:8881
      RAIDISH_NODE_ID: "2"
      RAIDISH_PORT: "8883"
    command: --config /etc/raidish/node.yaml listen --port 8883
    ports: ["127.0.0.1:8883:8883"]
    volumes:
      - ./docker/node2.yaml:/etc/raidish/node.yaml:ro
      - ./docker/pki/tokens:/pki/tokens:ro
      - ./docker/pki/node2:/etc/raidish/tls
      - node2:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/etc/raidish/tls/ca.pem", "--cert", "/etc/raidish/tls/cert.pem", "--key", "/etc/raidish/tls/key.pem", "https://localhost:8883/api/v1/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Formats the pool on first start and creates a demo volume; a no-op after.
  init:
    image: raidish
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./docker/init.sh:/init.sh:ro
      - ./docker/pki/admin:/etc/raidish/tls:ro
    depends_on:
      node0: { condition: service_healthy }
      node1: { condition: service_healthy }
      node2: { condition: service_healthy }

  # Optional (`docker compose --profile nfs-test up -d nfs-client`): a
  # privileged container with the NFS client tools, to mount the nodes'
  # NFS servers, e.g.
  #   docker compose exec nfs-client mount -t nfs \
  #     -o vers=3,proto=tcp,port=2049,mountport=2049,mountproto=tcp,nolock node0:/ /mnt
  nfs-client:
    profiles: ["nfs-test"]
    build:
      context: docker
      dockerfile: nfs-client.Dockerfile
    privileged: true
    entrypoint: ["sleep", "infinity"]
    depends_on:
      init: { condition: service_completed_successfully }

volumes:
  node0:
  node1:
  node2:
