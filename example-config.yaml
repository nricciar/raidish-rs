---
# The disks this node serves (`listen`), as a raidz2 pool.
# See README "Pool layouts" for other layouts.
pool:
  raidz2:
    - disks/disk1
    - disks/disk2
    - disks/disk3
    - disks/disk4
    - disks/disk5
# The cluster comes from the pool: each remote disk URL is a `listen` node,
# local paths are this node. All local, as here: a cluster of one.
# cluster:
#   data_dir: ~/.raidish     # Raft state goes in <data_dir>/<name>
