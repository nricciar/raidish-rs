# node0: its own disk is a local path, the others are URLs. Every node lists
# the disks in the same order; a URL's disk index is its pool position.
pool:
  raidz1:
    - /data/disk
    - http://node1:8882/api/v1/disks/1
    - http://node2:8883/api/v1/disks/2
cluster:
  data_dir: /data/raft
# Export volumes, but don't attach kernel devices (unprivileged containers).
automount:
  helper: none
