# node1: its own disk is a local path, the others are URLs. Every node lists
# the disks in the same order; a URL's disk index is its pool position.
pool:
  raidz1:
    - https://node0:8881/api/v1/disks/0
    - /data/disk
    - https://node2:8883/api/v1/disks/2
cluster:
  data_dir: /data/raft
# Export volumes, but don't attach kernel devices (unprivileged containers).
automount:
  helper: none
# The certificate bundle `pki` made for this node (see docker-compose.yml).
tls:
  dir: /etc/raidish/tls
# NFS (3 and 4.1) for the compose network (try it with: docker compose
# --profile nfs-test up -d nfs-client; see the README).
nfs:
  bind: 0.0.0.0
