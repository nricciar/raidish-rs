[package]
name = "raidish-cluster"
version = "0.1.0"
edition = "2024"
description = "The RAIDish cluster: the nodes' Raft group (openraft) and the lease API."

[features]
testutil = ["raidish-types/testutil", "raidish-auth/testutil"]

[dependencies]
raidish-types = { workspace = true }
raidish-auth = { workspace = true }
openraft = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs", "sync"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-manual-roots", "stream"] }
axum = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
ring = { workspace = true }
url = { workspace = true }

[dev-dependencies]
raidish-types = { workspace = true, features = ["testutil"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
