name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref; keep the latest.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Tests + workspace build (protocol, common, api, pskrep, ui).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install protobuf-compiler

      - name: Install Rust toolchain + targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # The release build bundles the web dashboard (see build.rs).
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Clippy (wasm)
        run: cargo clippy -p raidish -p raidish-web --target wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Release build
        run: cargo build --workspace --release
