[package]
name = "raidish-types"
version = "0.1.0"
edition = "2024"
description = "RAIDish's plain data: identifiers, the HTTP API's types, cluster state. Native and wasm32."

[features]
# Test helpers (`types::ep`, `From<u64>` for the id types, ...) for other
# crates' tests.
testutil = []

[dependencies]
serde = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
