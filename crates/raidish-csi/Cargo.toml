[package]
name = "raidish-csi"
version = "0.1.0"
edition = "2024"
description = "`raidish csi`: a Container Storage Interface driver serving RAIDish volumes to Kubernetes."
build = "build.rs"

[dependencies]
raidish-types = { workspace = true }
raidish-core = { workspace = true }
raidish-auth = { workspace = true }
raidish-cluster = { workspace = true }
raidish-committer = { workspace = true }
raidish-vm = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "fs", "process"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-manual-roots"] }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
