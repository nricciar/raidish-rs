# node2: its own disk is a local path, the others are URLs. Every node lists
# the disks in the same order; a URL's disk index is its pool position.
pool:
  raidz1:
    - https://node0:8881/api/v1/disks/0
    - https://node1:8882/api/v1/disks/1
    - /data/disk
cluster:
  data_dir: /data/raft
# Export volumes, but don't attach kernel devices (unprivileged containers).
automount:
  helper: none
  # Reachable from the compose network (the nfs-client container).
  bind: 0.0.0.0
# This node's certificate, from the cluster CA (ca init / join, see docker-compose.yml).
tls:
  dir: /etc/raidish/tls
# NFS (3 and 4.1) for the compose network (try it with: docker compose
# --profile nfs-test up -d nfs-client; see the README).
nfs:
  bind: 0.0.0.0
# S3 (9000) and SQS (9324) over HTTPS, and etcd datasets (their own
# ports, TLS with client certificates), on every node: a dataset runs on one
# node and the others forward to it. S3/SQS access keys are made from tokens
# (`raidish token s3-key`); see "Services" in the README.
services:
  advertise: node2
