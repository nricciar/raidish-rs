[package]
name = "raidish-auth"
version = "0.1.0"
edition = "2024"
description = "RAIDish identity and transport: the cluster PKI, TLS, request authentication, the TCP accept loop."

[features]
testutil = ["dep:tempfile", "raidish-types/testutil"]

[dependencies]
raidish-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
rocket = { workspace = true, features = ["json", "tls", "mtls"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-manual-roots", "stream"] }
rustls = { workspace = true, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { workspace = true, features = ["__rustls-tls"] }
rcgen = { workspace = true, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
blake3 = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
raidish-types = { workspace = true, features = ["testutil"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
